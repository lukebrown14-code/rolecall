version: 2

project_name: rolecall

builds:
  - id: rolecall
    main: ./cmd/rolecall
    binary: rolecall
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
archives:
  - id: rolecall
    ids:
      - rolecall
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - plugin/.claude-plugin/**
      - plugin/README.md
      - plugin/scripts/*.py
      - plugin/skills/**
      - plugin/styles/**
      - plugin/templates/**
      - plugin/writing-rules.md

checksum:
  name_template: checksums.txt

release:
  github:
    owner: lukebrown14-code
    name: rolecall

brews:
  - name: rolecall
    repository:
      owner: lukebrown14-code
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/lukebrown14-code/rolecall"
    description: "A terminal job tracker with a bundled AI harness Plugin"
    license: MIT
    ids:
      - rolecall
    install: |
      bin.install "rolecall"
      libexec.install "plugin"
