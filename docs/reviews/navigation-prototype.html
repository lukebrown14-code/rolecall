<!doctype html>
<!-- Throwaway UI prototype: does moving Profile and Settings out of primary navigation improve focus? Three variants via ?variant=A|B|C. No persistent state or production integration. -->
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rolecall navigation prototype</title>
<style>
:root{color-scheme:dark;--font-sans:system-ui;--font-mono:ui-monospace,SFMono-Regular,Consolas,monospace;--foreground:#e4e9ee;--muted-foreground:#a1acb9;--border:#465361;--secondary:#26333d;--primary:#9ad5cf;--radius:8px}*{box-sizing:border-box}body{margin:0;color:var(--foreground);font:14px var(--font-sans)}p{color:var(--muted-foreground);line-height:1.6}button,input{font:inherit}button{color:inherit;cursor:pointer;background:transparent;border:0;padding:9px 10px;text-align:left}button:hover{background:#24353e}button:focus-visible,input:focus-visible{outline:2px solid #9ad5cf;outline-offset:2px}button.active{color:#d9f4ee;background:#263e46}small{color:#a1acb9}kbd{font:inherit;color:#9ad5cf}.controls{display:flex;gap:8px;align-items:center;margin:12px 0;flex-wrap:wrap}.controls button{border:1px solid var(--border);border-radius:6px}.terminal{position:relative;background:#10161d;color:#e4e9ee;border:1px solid #364450;border-radius:8px;padding:16px;font:12px/1.6 var(--font-mono);min-height:490px;max-width:1100px;margin:auto}.terminal.compact{max-width:530px}.header{display:flex;align-items:center;gap:6px;border-bottom:1px solid #465361;padding-bottom:12px;flex-wrap:wrap}.brand{color:#9ad5cf;font-weight:700;margin-right:12px}.spacer{flex:1}.workspace{display:flex;min-height:370px}.rail{flex:0 0 125px;border-right:1px solid #465361;padding:16px 12px 0 0;display:flex;flex-direction:column;gap:3px}.main{flex:1;min-width:0;padding:16px 0}.rail+.main{padding-left:16px}.title{display:flex;gap:12px;align-items:center;margin-bottom:12px}.title strong{font-size:15px;color:#9ad5cf}.filters{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}.filters button{padding:4px 8px}.columns{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(150px,1fr);gap:18px}.rows button{display:block;width:100%;padding:10px 8px;border-left:2px solid transparent;margin-bottom:4px}.rows button.active{border-left-color:#9ad5cf}.rowline{display:flex;justify-content:space-between;gap:8px}.status{font-size:11px;color:#a1acb9}.company{display:block;color:#a1acb9;margin-top:3px}.preview{border-left:1px solid #465361;padding-left:18px}.label{color:#9ad5cf;letter-spacing:1px;font-size:10px;margin:20px 0 5px}.preview h3{font-size:13px;margin:0 0 4px}.footer{border-top:1px solid #465361;padding-top:12px;display:flex;justify-content:space-between;gap:12px;color:#a1acb9}.footer{flex-wrap:wrap}.footer button{padding:0;color:#9ad5cf}.popup{position:absolute;z-index:5;right:16px;top:68px;width:235px;background:#1b252e;border:1px solid #758593;border-radius:4px;padding:8px;box-shadow:0 12px 25px #0008}.popup button{display:flex;justify-content:space-between;width:100%}.popup .label{padding:0 10px;margin:8px 0}.sectionnav{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:22px}.field{display:grid;grid-template-columns:145px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid #28343f}input{background:#1c2932;border:1px solid #526473;color:#e4e9ee;padding:8px;max-width:100%;width:220px}.state{font:11px/1.6 var(--font-mono);margin:14px 0 70px;color:var(--muted-foreground)}.switcher{position:fixed;z-index:10;bottom:12px;left:50%;transform:translateX(-50%);background:var(--secondary);border:1px solid var(--border);border-radius:30px;display:flex;align-items:center;white-space:nowrap;padding:3px 8px;box-shadow:0 4px 18px #0006}.switcher span{font-size:12px;padding:0 10px}.compact .columns{grid-template-columns:1fr}.compact .preview{display:none}.compact .header{gap:0}.compact .header button{padding:8px 6px}.compact .brand{margin-right:6px}.compact .rail{flex-basis:100px}.empty{padding:45px 8px;text-align:center;color:#a1acb9}.notice{color:#9ad5cf;margin:14px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stats div{padding:20px 8px;border-bottom:1px solid #465361}.stats strong{display:block;font-size:25px;color:#9ad5cf}@media(max-width:600px){.columns{grid-template-columns:1fr}.preview{display:none}.terminal{padding:10px}.brand{width:100%}.field{grid-template-columns:1fr}.rail{flex-basis:95px}.switcher span{max-width:240px;overflow:hidden;text-overflow:ellipsis}}

.bodytools{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid #465361;padding-bottom:12px;margin-bottom:14px}.bodytools .filters{margin:0}.tracks{display:flex;align-items:center;gap:3px;white-space:nowrap}.tracks button{padding:4px 6px}.columns.classic{grid-template-columns:minmax(0,1.25fr) minmax(230px,1fr);gap:16px}.group{--stage:#a1acb9;margin-bottom:18px}.group.applied{--stage:#58a6ff}.group.interviewing{--stage:#bc8cff}.group.offer{--stage:#f2cc60}.grouphead{display:flex;align-items:center;gap:10px;color:var(--stage);font-weight:700;padding:0 8px;margin-bottom:5px}.grouphead i{flex:1;height:1px;background:var(--stage);opacity:.7}.stage{color:var(--stage)}.rows .group button{padding:6px 8px;margin:0 0 6px}.rowline .role{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.rowmeta{display:flex;gap:14px;align-items:center;flex-shrink:0}.fit{white-space:pre;color:#a1acb9}.flag{color:#a1acb9;font-size:11px}.interviewing .flag{color:#f0883e}.company{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding-left:16px}.summary-status{margin:22px 0 5px}.docline{color:#a1acb9;line-height:1.8}.next{margin:22px 0 26px}.next .label{display:inline;margin-right:5px;color:#a1acb9}.movehint{white-space:nowrap}.timeline{color:#a1acb9;line-height:1.8}.preview .label{color:#a1acb9;font-weight:700}.compact .columns.classic{grid-template-columns:1fr}.compact .rowmeta{gap:6px}.compact .bodytools{gap:6px}.compact .tracks{font-size:11px}@media(max-width:600px){.columns.classic{grid-template-columns:1fr}.rowmeta{gap:6px}.flag{max-width:65px;overflow:hidden;text-overflow:ellipsis}}

/* Status and track are independent filters. Solid selection; outline-only hover. */
.bodytools{gap:18px;padding:8px 0 16px;margin-bottom:18px;align-items:center}.statusfilters{display:flex;align-items:center;gap:12px;min-width:0}.filterlabel{font-size:10px;letter-spacing:1.1px;color:#a1acb9;white-space:nowrap}.bodytools .filters{gap:6px}.bodytools .filters button{display:flex;align-items:center;gap:8px;padding:6px 9px;border:1px solid transparent;border-bottom:2px solid transparent;color:#a1acb9;background:transparent}.bodytools .filters button:hover{border-color:#465361;color:#e4e9ee;background:transparent}.bodytools .filters button.active{background:#263e46;border-color:transparent;border-bottom-color:#9ad5cf;color:#edf7f5}.count{font-size:10px;color:#8b9baa;font-variant-numeric:tabular-nums}.active .count{color:#b6d5d1}.tracks{border-left:1px solid #465361;padding-left:18px;gap:6px}.tracks .filterlabel{margin-right:4px}.tracks .filterlabel kbd{letter-spacing:0;margin-left:4px}.tracks button{padding:4px 5px;border-bottom:1px solid transparent;background:transparent;color:#a1acb9}.tracks button:hover{border-bottom-color:#627383;background:transparent;color:#e4e9ee}.tracks button.active{color:#9ad5cf;border-bottom-color:#9ad5cf;background:transparent}.compact .statusfilters{display:block}.compact .filterlabel{display:block;margin-bottom:6px}.compact .tracks{border-left:0;padding-left:0}.compact .tracks .filterlabel{display:inline;margin-bottom:0}@media(max-width:900px){.statusfilters{flex-wrap:wrap;gap:6px}.tracks{border-left:0;padding-left:0}.bodytools{gap:10px}.bodytools .filters button{padding:5px 7px;gap:5px}}
</style>
<p>Throwaway navigation prototype · Compare where supporting screens belong. Click the UI or use keys 1–6, Shift+M for Menu, and Esc to return. Original Applied fixture rows restored. Footer shortcuts illustrate the proposed TUI; editing actions are not implemented.</p>
<div class="controls"><button id="size" onclick="compact=!compact;render()">Toggle compact width</button><span id="description"></span></div>
<div id="app" class="terminal"></div><div class="state" id="state"></div>
<div class="switcher" aria-label="Prototype variants"><button onclick="cycle(-1)" aria-label="Previous variant">←</button><span id="variantLabel"></span><button onclick="cycle(1)" aria-label="Next variant">→</button></div>
<script>
const names={A:'Top bar + Menu',B:'Workspace rail',C:'Minimal screen picker'};
const explanations={A:'Simpler navigation with the original grouped list and full preview.',B:'Primary screens in a left rail. Menu stays at the bottom.',C:'One current-screen label. Open it to switch workspace.'};
let variant=new URLSearchParams(location.search).get('variant')||'A';if(!names[variant])variant='A';
let screen='Applied',last='Applied',menu=false,picker=false,compact=false,selected=0,filter='All',section='Tracking',notice='';
const jobs=[{"role": "Software Engineer", "company": "Orbit Labs", "track": "SWE", "status": "Applied", "age": "applied 6d ago", "fit": "\u2014", "flag": "", "ready": 0}, {"role": "Engineer #1", "company": "Example", "track": "Unknown", "status": "Interviewing", "age": "applied ~Jan 2025 \u00b7 interviewing ~Jan 2026", "fit": "Good", "flag": "\u2691 quiet 9mo", "ready": 0}, {"role": "docs-written", "company": "Fictional Labs", "track": "SWE", "status": "Interviewing", "age": "interviewing ~7d ago", "fit": "\u2014", "flag": "", "ready": 2}, {"role": "Engineer #1", "company": "Example", "track": "Unknown", "status": "Offer", "age": "applied ~Jan 2025 \u00b7 offer ~Jan 2026", "fit": "Good", "flag": "", "ready": 0}, {"role": "docs-partial", "company": "Fictional Labs", "track": "SWE", "status": "Offer", "age": "offer ~7d ago", "fit": "\u2014", "flag": "", "ready": 1}, {"role": "Engineer #1", "company": "Example", "track": "Unknown", "status": "Closed", "age": "closed ~Jan 2026", "fit": "Good", "flag": "rejected", "ready": 0}, {"role": "Engineer #1", "company": "Example", "track": "Unknown", "status": "Closed", "age": "closed ~Jan 2026", "fit": "Good", "flag": "withdrawn", "ready": 0}, {"role": "docs-ready", "company": "Fictional Labs", "track": "SWE", "status": "Closed", "age": "closed ~7d ago", "fit": "\u2014", "flag": "rejected", "ready": 4}, {"role": "docs-resume-only", "company": "Fictional Labs", "track": "SWE", "status": "Closed", "age": "closed ~7d ago", "fit": "\u2014", "flag": "withdrawn", "ready": 1}];
let track="All";
const primary=['Leads','Drafts','Applied','Stats'];
function go(s){if(primary.includes(screen))last=screen;screen=s;menu=picker=false;notice='';render()}
function back(){go(last)}
function toggleMenu(){menu=!menu;picker=false;render()}
function nav(){return primary.map((s,i)=>`<button class="${screen===s?'active':''}" onclick="go('${s}')"><kbd>${i+1}</kbd> ${s}${s==='Applied'?' 9':s==='Leads'?' 4':s==='Drafts'?' 2':''}</button>`).join('')}
function pop(){if(!menu&&!picker)return '';return `<div class="popup" role="navigation" aria-label="${menu?'Menu':'Screens'}"><div class="label">${menu?'WORKSPACE MENU':'GO TO SCREEN'}</div>${(picker?primary:['Profile','Settings','Help']).map((s,i)=>`<button onclick="go('${s}')">${s}<kbd>${picker?i+1:i===2?'?':i+5}</kbd></button>`).join('')}<button onclick="menu=picker=false;render()">Close<kbd>Esc</kbd></button></div>`}
function visibleJobs(){return jobs.map((j,i)=>({...j,i})).filter(j=>(screen!=='Applied'||filter==='All'||j.status===filter)&&(track==='All'||j.track===track))}
function chooseFilter(f){filter=f;render()}
function chooseTrack(t){track=t;render()}
function symbol(j){return j.status==='Applied'?'●':j.status==='Interviewing'?'◆':j.status==='Offer'?'★':j.flag==='withdrawn'?'↩':'✕'}
function list(){let shown=visibleJobs();if(shown.length&&!shown.some(j=>j.i===selected))selected=shown[0].i;let j=shown.length?jobs[selected]:null;
let groups=screen==='Applied'?['Applied','Interviewing','Offer','Closed']:[screen];
let tabs=screen==='Applied'?`<div class="filters">${['All',...groups].map(f=>`<button class="${filter===f?'active':''}" aria-pressed="${filter===f}" onclick="chooseFilter('${f}')"><span>${f}</span><span class="count">${jobs.filter(j=>(f==='All'||j.status===f)&&(track==='All'||j.track===track)).length}</span></button>`).join('')}</div>`:`<strong>${screen}</strong>`;
let body=groups.map(g=>{let items=shown.filter(j=>screen!=='Applied'||j.status===g);if(!items.length)return '';return `<section class="group ${g.toLowerCase()}"><div class="grouphead"><span>${screen==='Applied'?(g==='Closed'?'':symbol(items[0])+' '):''}${g} · ${items.length}</span><i></i></div>${items.map(j=>`<button class="${j.i===selected?'active':''}" onclick="selected=${j.i};render()"><span class="rowline"><span class="role"><span class="stage">${screen==='Applied'?symbol(j):screen==='Leads'?'◌':'◐'}</span> ${j.role}</span><span class="rowmeta"><span class="flag">${j.flag}</span><span class="fit">fit ${j.fit.padStart(4,' ')}</span></span></span><span class="company">${j.company} · ${j.track} · ${j.age}</span></button>`).join('')}</section>`}).join('');
let next=j?(j.status==='Applied'?'wait to hear back':j.status==='Interviewing'?'prepare for the interview':j.status==='Offer'?'review the offer':'application closed'):'';
return `<div class="bodytools"><div class="statusfilters"><span class="filterlabel">STATUS</span>${tabs}</div><div class="tracks"><span class="filterlabel">TRACK <kbd>t</kbd></span> ${['All','SWE','Platform'].map(t=>`<button class="${track===t?'active':''}" aria-pressed="${track===t}" onclick="chooseTrack('${t}')">${t}</button>`).join('')}</div></div><div class="columns classic"><div class="rows">${body||'<div class="empty">No applications match this view.</div>'}</div><aside class="preview">${j?`<h3>${j.role}</h3><small>${j.company} · ${j.track}</small><div class="summary-status">${symbol(j)} ${j.status} <small> · fit ${j.fit==='—'?'not assessed':j.fit}</small></div><div class="docline">${['JD','Resume','Cover letter','PDF'].map((d,i)=>`${i<j.ready?'✓':'○'} ${d}`).join(' &nbsp; ')}</div><small>${'▰'.repeat(j.ready)}${'▱'.repeat(4-j.ready)} ${j.ready} of 4 ready</small><div class="next"><span class="label">NEXT</span> ${next} <span class="movehint"><kbd>m</kbd> move</span></div><div class="label">TIMELINE</div><div class="timeline">${j.status==='Applied'?'◌ Lead ─ ● Applied 25 Sep ─ ◆ Interviewing':`◌ Lead ─ ● Applied ─ ${symbol(j)} ${j.status}`}</div><div class="label">FIT</div><small>${j.fit==='—'?'No fit assessment yet':'Good fit'}</small><div class="label">NOTES</div><small>No notes yet · <kbd>n</kbd> to add</small>`:'<small>Select another view to see an application.</small>'}</aside></div>`}

function supporting(){if(screen==='Settings')return `<div class="sectionnav">${['Search','Documents','Tracking','This machine'].map(s=>`<button class="${section===s?'active':''}" onclick="section='${s}';render()">${s}</button>`).join('')}</div>${section==='Tracking'?'<div class="label">TRACKS</div><div class="field"><span>SWE</span><span>10 applications</span></div><div class="field"><span>Platform</span><span>1 application</span></div><div class="label">FOLLOW-UP</div><label class="field"><span>Mark due after</span><span><input type="number" value="14" min="1" aria-label="Follow-up days"> days</span></label>':section==='Search'?'<label class="field"><span>Places</span><input value="Australia" aria-label="Places"></label>':section==='Documents'?'<label class="field"><span>Readiness threshold</span><input type="number" value="300" aria-label="Readiness threshold"></label>':'<label class="field"><span>Editor</span><input value="code --wait" aria-label="Editor"></label>'}<button onclick="notice='Preview only — no settings were saved.';document.getElementById('notice').textContent=notice">Preview save</button><div id="notice" class="notice">${notice}</div>`;
if(screen==='Profile')return '<div class="label">CONTACT</div><div class="field"><span>Name</span><span>Alex Quinn</span></div><div class="field"><span>Email</span><span>alex.quinn@example.test</span></div><div class="field"><span>Location</span><span>Brisbane, QLD</span></div><div class="label">PROFILE SECTIONS</div><p>Headlines · Experience · Key skills · Summary</p><small>Profile contents are illustrative and read-only in this prototype.</small>';
return '<div class="label">KEYBOARD SHORTCUTS</div><div class="field"><span>1–4</span><span>Leads, Drafts, Applied, Stats</span></div><div class="field"><span>5 / 6</span><span>Profile / Settings</span></div><div class="field"><span>M</span><span>Open Menu</span></div><div class="field"><span>Esc</span><span>Close Menu or return to workspace</span></div><div class="field"><span>← / →</span><span>Compare prototype variants</span></div>'}
function render(){let supportingScreen=!primary.includes(screen);let header=supportingScreen?`<button onclick="back()"><kbd>Esc</kbd> back to ${last}</button><span class="spacer"></span><strong>${screen}${screen==='Settings'?' / '+section:''}</strong>`:variant==='A'?`<span class="brand">▞ rolecall</span>${nav()}<span class="spacer"></span><button onclick="toggleMenu()" aria-expanded="${menu}"><kbd>M menu</kbd></button>`:variant==='B'?'<span class="brand">▞ rolecall</span><span class="spacer"></span><small>10 live · 1 due</small>':`<span class="brand">▞ rolecall</span><button onclick="picker=!picker;menu=false;render()" aria-expanded="${picker}">${screen} ▾</button><span class="spacer"></span><button onclick="toggleMenu()" aria-expanded="${menu}"><kbd>M menu</kbd></button>`;
let rail=variant==='B'&&!supportingScreen?`<aside class="rail">${nav()}<span class="spacer"></span><button onclick="toggleMenu()">Menu ▾</button></aside>`:'';
let content=supportingScreen?supporting():screen==='Stats'?'<div class="title"><strong>Stats</strong><small>Illustrative data</small></div><div class="stats"><div><strong>7</strong>Applied</div><div><strong>2</strong>Responses</div><div><strong>33%</strong>Response rate</div></div><p>Responses among applications old enough to judge.</p>':list();
document.getElementById('app').className='terminal'+(compact?' compact':'');document.getElementById('app').innerHTML=`<header class="header">${header}</header><div class="workspace">${rail}<main class="main">${content}</main></div><footer class="footer"><span>${supportingScreen?'Supporting screen':screen==='Stats'?'Workspace overview':'<kbd>Enter</kbd> open · <kbd>e</kbd> edit · <kbd>m</kbd> move · <kbd>n</kbd> notes · <kbd>a</kbd> add · <kbd>/</kbd> search'}</span><span>${supportingScreen?'<button onclick="back()">Esc back</button>':'<span>←→ view · 1–4 screen · : commands · </span><button onclick="go(\'Help\')">? help</button>'}</span></footer>${pop()}`;
document.getElementById('variantLabel').textContent=variant+' · '+names[variant];document.getElementById('description').textContent=explanations[variant];document.getElementById('state').textContent=`PROTOTYPE STATE  variant=${variant} · screen=${screen} · return=${last} · menu=${menu?'open':'closed'} · width=${compact?'compact':'wide'} · filter=${filter} · selected=${selected+1}`;
}
function cycle(d){let a=['A','B','C'];variant=a[(a.indexOf(variant)+d+3)%3];menu=picker=false;let u=new URL(location.href);u.searchParams.set('variant',variant);history.replaceState(null,'',u);render()}
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowRight'?1:-1)}else if(e.key==='Escape'){if(menu||picker){menu=picker=false;render()}else if(!primary.includes(screen))back()}else if(e.key==='M')toggleMenu();else if('123456'.includes(e.key)&&e.key.length===1)go([...primary,'Profile','Settings'][Number(e.key)-1]);else if(e.key==='?')go('Help');else if(['ArrowDown','ArrowUp'].includes(e.key)&&!menu&&!picker&&primary.includes(screen)&&screen!=='Stats'){e.preventDefault();let available=visibleJobs().map(j=>j.i);if(available.length){selected=available[(available.indexOf(selected)+(e.key==='ArrowDown'?1:available.length-1)+available.length)%available.length];render()}}});
render();
</script>
