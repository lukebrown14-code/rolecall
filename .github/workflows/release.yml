name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: python3 -m pip install pytest==9.2.0
      - run: go test ./...
      - run: python3 -m pytest plugin/tests scripts/test_check_personal_data.py

  goreleaser:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@v7
        with:
          # GoReleaser removed formula generation in v2.16; v2.9.0 is the last
          # release that supports the required binary Homebrew formula.
          version: v2.9.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
