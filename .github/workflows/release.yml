name: Release

on:
  push:
    tags:
      - "v*"

# Read-only by default; only the publishing job gets a write token.
permissions:
  contents: read

jobs:
  # The release gate is the CI workflow itself (lint, check-go, race, govulncheck,
  # personal-data scan, macOS and Python), so the two cannot drift apart.
  ci:
    uses: ./.github/workflows/go.yml

  goreleaser:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@v7
        with:
          # Exact, so a new GoReleaser release cannot change what ships.
          version: v2.20.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
