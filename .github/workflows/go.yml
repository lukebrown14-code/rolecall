name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 scripts/check-personal-data.py .
      # The Owner-terms guard belongs to the public repository, where the
      # ROLECALL_PERSONAL_DATA_TERMS secret is configured (ADR-0005 and the
      # public-repo cut checklist). The private archive and forks run the
      # generic scan above and skip this step.
      - name: Check Owner-specific terms
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.repository.private
        env:
          ROLECALL_PERSONAL_DATA_TERMS: ${{ secrets.ROLECALL_PERSONAL_DATA_TERMS }}
        run: |
          if [ -z "$ROLECALL_PERSONAL_DATA_TERMS" ]; then
            echo "ROLECALL_PERSONAL_DATA_TERMS secret is required on main" >&2
            exit 1
          fi
          python3 scripts/check-personal-data.py .
      - run: python3 scripts/check-skills.py
      - run: scripts/test-pre-commit.sh
      # The action installs and runs golangci-lint; scripts/check-go.sh skips
      # its own lint pass when CI is set, so lint runs once.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - run: scripts/check-go.sh
      - run: go test -race ./...

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # Pin these so a newer release cannot change the rules mid-branch.
      - run: python3 -m pip install pytest==9.2.0 ruff==0.15.0
      - run: ruff check plugin
      - run: python3 -m pytest plugin/tests scripts/test_check_personal_data.py
