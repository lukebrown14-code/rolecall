name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 scripts/check-personal-data.py .
      - name: Check Owner-specific terms
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ROLECALL_PERSONAL_DATA_TERMS: ${{ secrets.ROLECALL_PERSONAL_DATA_TERMS }}
        run: |
          if [ -z "$ROLECALL_PERSONAL_DATA_TERMS" ]; then
            echo "ROLECALL_PERSONAL_DATA_TERMS secret is required on main" >&2
            exit 1
          fi
          python3 scripts/check-personal-data.py .
      - run: python3 scripts/check-skills.py
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - run: scripts/check-go.sh
      - run: go test -race -count=3 ./internal/ui/...
      - run: go test -race ./...

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 -m pip install pytest ruff
      - run: ruff check plugin
      - run: python3 -m pytest plugin/tests
