name: CI
on:
  # Branch pushes only: a tag push runs these same jobs through release.yml.
  push:
    branches: ["**"]
  pull_request:
  # release.yml calls this workflow as its gate, so a release runs every CI check.
  workflow_call:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: python3 scripts/check-personal-data.py .
      - run: scripts/test-pre-commit.sh
      # The action installs and runs golangci-lint; scripts/check-go.sh skips
      # its own lint pass when CI is set, so lint runs once.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - run: scripts/check-go.sh
      - run: go test -race ./...
      # Tests pin their own environment (internal/testenv); a developer shell with these
      # set must not change a result.
      - name: Test under a hostile environment
        run: go test ./...
        env:
          NO_COLOR: "1"
          COLORFGBG: "15;0"
          ROLECALL_THEME: light
          ROLECALL_PLAIN: "1"
          ROLECALL_ASCII: "1"
          TERM: linux
          LANG: C
          EDITOR: nano
          VISUAL: code
          ROLECALL_PLUGIN: /nonexistent
          TZ: Pacific/Kiritimati
      - name: Scan dependencies for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: scripts/check-go.sh
      - run: go test ./...

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      # Pin these so a newer release cannot change the rules mid-branch.
      - run: python3 -m pip install pytest==9.2.0 ruff==0.15.0
      - run: ruff check plugin
      - run: python3 -m pytest plugin/tests scripts/test_check_personal_data.py
